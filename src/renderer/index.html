<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>md-view</title>
    <base id="content-base" href="" />
    <link id="theme-markdown-light" rel="stylesheet" href="./github-markdown-light.css" />
    <link id="theme-markdown-dark" rel="stylesheet" href="./github-markdown-dark.css" disabled />
    <link id="theme-hljs-light" rel="stylesheet" href="./github.css" />
    <link id="theme-hljs-dark" rel="stylesheet" href="./github-dark.css" disabled />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="title-bar">
      <div id="menu-label-file" class="menu-label">File</div>
      <div id="menu-label-view" class="menu-label">View</div>
      <div id="menu-label-help" class="menu-label">Help</div>
      <div id="title-bar-spacer"></div>
      <button type="button" id="window-minimize" class="window-control" aria-label="Minimize"></button>
      <button type="button" id="window-maximize" class="window-control" aria-label="Maximize"></button>
      <button type="button" id="window-close" class="window-control window-control-close" aria-label="Close"></button>
    </div>
    <div id="app-body">
      <div id="tree-panel">
        <div id="tree-empty-state">No folder open.</div>
        <div id="tree-root" hidden></div>
      </div>
      <div id="tree-resize-handle"></div>
      <div id="main-panel">
        <div id="empty-state">No file open. Use File &gt; Open… (Ctrl+O) to open a Markdown file.</div>
        <div id="document-container">
          <div id="document-header">
            <button type="button" id="tab-preview" class="doc-tab active">Preview</button>
            <button type="button" id="tab-code" class="doc-tab">Code</button>
            <div id="document-header-spacer"></div>
            <button type="button" id="copy-raw-source" class="doc-header-action" aria-label="Copy raw Markdown" disabled>
              <svg class="icon-copy" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                <path d="M3.5 9V3C3.5 2.44772 3.94772 2 4.5 2H10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              </svg>
              <svg class="icon-check" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 8.5L6.5 12L13 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div id="document-main">
            <pre id="frontmatter" hidden></pre>
            <div id="content" class="markdown-body"></div>
            <pre id="code-content" hidden></pre>
          </div>
        </div>
      </div>
    </div>
    <div id="status-bar">No file open</div>
    <script src="./renderer.js"></script>
  </body>
</html>
